<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lawn-A-Mercy Connect</title><style>body{margin:0;background:#07170b;color:#fff;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.box{width:min(520px,calc(100% - 32px));text-align:center}.logo{width:320px;max-width:90%}.btn{display:block;margin:12px 0;padding:16px;border-radius:12px;background:#f6b817;color:#111;font-weight:900;text-decoration:none}.sub{background:#132417;color:#fff;border:1px solid #315b36}small{color:#bdd0bf}</style></head><body><main class="box"><img class="logo" src="../assets/brand/logo.svg" alt="Lawn-A-Mercy"><h1>Connect with Lawn-A-Mercy</h1><p id="status">Loading current links…</p><div id="links"></div><small>Permanent QR routing page. Trio can change these destinations without changing the printed QR.</small></main><script>async function load(u){const s=u.includes('?')?'&':'?';const r=await fetch(u+s+'v='+Date.now(),{cache:'no-store'});return r.json()}(async()=>{try{let c=await load('../data/site.json');if(c.runtime?.remote_config_url){try{c=await load(c.runtime.remote_config_url)}catch{}}const q=new URLSearchParams(location.search).get('to')||'socials';if(q!=='socials'){const direct=c.routes?.[q]||c.social?.[q];if(direct){location.replace(direct);return}}const box=document.getElementById('links');document.getElementById('status').textContent='Choose where you want to connect:';for(const[k,v]of Object.entries(c.social||{})){const a=document.createElement('a');a.className='btn';a.href=v;a.textContent=k[0].toUpperCase()+k.slice(1);box.appendChild(a)}const call=document.createElement('a');call.className='btn sub';call.href=c.routes?.call||'tel:+16782384010';call.textContent='Call / Text '+c.contact.phone;box.appendChild(call)}catch(e){document.getElementById('status').textContent='Call or text 678-238-4010'}})();</script></body></html>
