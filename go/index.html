<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06110b"><title>Connect with Lawn-A-Mercy</title><style>
:root{--deep:#06110b;--green:#0b361c;--leaf:#46a638;--gold:#ffc300;--paper:#fffdf5;--ink:#0a160e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 12%,#154826,transparent 30%),var(--deep);color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.page{width:min(760px,calc(100% - 28px));margin:auto;padding:36px 0 56px}.logo{display:block;width:250px;height:82px;object-fit:contain;object-position:left}.heading{display:flex;align-items:center;justify-content:center;gap:14px;margin:28px 0 6px}.heading img{width:34px;height:46px;color:var(--gold)}.heading img:last-child{transform:scaleX(-1)}h1{margin:0;font-family:Impact,"Arial Narrow",sans-serif;font-size:clamp(3.6rem,11vw,6.7rem);line-height:.85;text-align:center;text-transform:uppercase}.sub{text-align:center;color:#bac8bf;margin:18px auto 26px;max-width:600px}.contact-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}.contact{min-height:120px;display:flex;flex-direction:column;justify-content:center;padding:20px;border-radius:20px;text-decoration:none}.contact.call{background:var(--gold);color:var(--ink)}.contact.text{background:linear-gradient(135deg,var(--leaf),#1c6b2a);color:#fff}.contact span{font-size:.72rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.contact strong{font-family:Impact,"Arial Narrow",sans-serif;font-size:clamp(2rem,7vw,3.3rem)}.contact small{font-weight:700;opacity:.75}.socials{display:grid;gap:10px}.social{display:grid;grid-template-columns:1fr auto;align-items:center;min-height:78px;padding:16px 18px;border:1px solid rgba(255,255,255,.16);border-radius:16px;background:rgba(255,255,255,.04);text-decoration:none}.social strong,.social span{display:block}.social strong{color:var(--gold);font-size:1.05rem}.social span{font-size:.78rem;color:#c0cbc4}.social b{font-size:1.5rem;color:var(--leaf)}.home{display:inline-block;margin-top:24px;color:#c1ccc5}.status{text-align:center;color:#99aa9f;font-size:.78rem}.island-line{height:5px;margin:30px 0;background:linear-gradient(90deg,var(--gold),var(--leaf),#ce1126,#fff)}@media(max-width:560px){.contact-row{grid-template-columns:1fr}.page{padding-top:22px}.logo{margin:auto}.contact strong{font-size:2.35rem}}</style></head>
<body><main class="page"><img class="logo" src="../assets/brand/logo.svg" alt="Lawn-A-Mercy Landscaping"><div class="heading"><img src="../assets/brand/palm.svg" alt=""><h1>Link wi.</h1><img src="../assets/brand/palm.svg" alt=""></div><p class="sub">New number, same Lawn-A-Mercy. Call or text us, then tap the social you want below.</p><div class="contact-row"><a class="contact call" id="call" href="tel:+16782384010"><span>Call Lawn-A-Mercy</span><strong id="callPhone">678-238-4010</strong><small>Talk through your project</small></a><a class="contact text" id="text" href="sms:+16782384010"><span>Text Lawn-A-Mercy</span><strong id="textPhone">678-238-4010</strong><small>Send photos + get an estimate started</small></a></div><div class="island-line"></div><p class="status" id="status">Loading current profiles…</p><div class="socials" id="socials"></div><a class="home" href="../">← Visit the Lawn-A-Mercy website</a></main><script>
function safe(v){try{const u=new URL(v,document.baseURI);return['https:','tel:','sms:','mailto:'].includes(u.protocol)?u.href:''}catch{return''}}async function load(u){const m=u.includes('?')?'&':'?';const r=await fetch(u+m+'v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}function merge(a,b){if(!b||typeof b!=='object'||Array.isArray(b))return a;const o={...a};for(const[k,v]of Object.entries(b))o[k]=v&&typeof v==='object'&&!Array.isArray(v)&&a?.[k]&&typeof a[k]==='object'?merge(a[k],v):v;return o}(async()=>{try{let c=await load('../data/site.json');if(c.runtime?.remote_config_url){try{c=merge(c,await load(c.runtime.remote_config_url))}catch{}}const to=new URLSearchParams(location.search).get('to')||'socials';if(to!=='socials'){const d=safe(c.routes?.[to]||c.social?.[to]);if(d){location.replace(d);return}}const call=safe(c.routes?.call)||'tel:+16782384010',text=safe(c.routes?.text)||'sms:+16782384010';document.getElementById('call').href=call;document.getElementById('text').href=text;document.getElementById('callPhone').textContent=c.contact?.phone||'678-238-4010';document.getElementById('textPhone').textContent=c.contact?.phone||'678-238-4010';const box=document.getElementById('socials');for(const[n,v]of Object.entries(c.social||{})){const u=safe(v);if(!u)continue;const a=document.createElement('a');a.className='social';a.href=u;a.target='_blank';a.rel='noopener noreferrer';const left=document.createElement('span');const s=document.createElement('strong');s.textContent=n[0].toUpperCase()+n.slice(1);const h=document.createElement('span');h.textContent=c.social_handles?.[n]||'Follow Lawn-A-Mercy';left.append(s,h);const arrow=document.createElement('b');arrow.textContent='↗';a.append(left,arrow);box.append(a)}document.getElementById('status').textContent='Choose where you want to connect.'}catch(e){document.getElementById('status').textContent='Could not load profiles. Call or text 678-238-4010.'}})();
</script></body></html>
