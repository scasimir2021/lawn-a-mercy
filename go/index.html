<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b2115">
  <title>Connect with Lawn-A-Mercy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--green:#0b2115;--deep:#06110b;--gold:#e9ad19;--paper:#f5f2e9;--muted:#aebbb2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 80% 10%,#173b25,transparent 30%),var(--deep);color:#fff;font-family:Manrope,"Segoe UI",sans-serif}.card{width:min(580px,100%);padding:clamp(28px,6vw,56px);border-top:7px solid var(--gold);background:var(--paper);color:#142018;box-shadow:0 30px 90px rgba(0,0,0,.35)}.logo{display:block;width:250px;max-width:78%;height:78px;object-fit:contain;object-position:left;margin-bottom:34px;filter:drop-shadow(0 1px 0 rgba(0,0,0,.2))}.eyebrow{margin:0 0 11px;color:#3f7d32;font-family:"Barlow Condensed",sans-serif;font-size:.8rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase}h1{margin:0;font-family:"Barlow Condensed",sans-serif;font-size:clamp(3.1rem,10vw,5.2rem);font-weight:900;letter-spacing:-.035em;line-height:.88;text-transform:uppercase}#status{margin:22px 0 28px;color:#5d6a62;line-height:1.7}.links{display:grid;gap:10px}.link{display:grid;grid-template-columns:42px 1fr auto;gap:14px;align-items:center;min-height:68px;padding:11px 15px;border:1px solid #c9c4b8;color:var(--green);text-decoration:none;transition:border-color .2s,transform .2s}.link:hover{border-color:#3f7d32;transform:translateX(3px)}.icon{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:var(--green);color:#fff}.icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}.copy strong,.copy span{display:block}.copy strong{font-family:"Barlow Condensed",sans-serif;font-size:1.18rem;letter-spacing:.04em;text-transform:uppercase}.copy span{color:#6d776f;font-size:.73rem}.arrow{color:#3f7d32;font-size:1.2rem}.link-call{background:var(--gold);border-color:var(--gold)}.link-call .icon{background:#111}.home{display:inline-block;margin-top:28px;color:#405247;font-size:.76rem;font-weight:700;text-underline-offset:4px}.fallback{padding:16px;border:1px solid #c9c4b8}.fallback a{color:var(--green);font-weight:800}@media(max-width:440px){body{padding:0}.card{min-height:100vh;padding:28px 20px}.link{grid-template-columns:40px 1fr auto;padding-inline:10px}}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="../assets/brand/logo.svg" alt="Lawn-A-Mercy Landscaping">
    <p class="eyebrow">Social hub</p>
    <h1>Connect with us.</h1>
    <p id="status">Loading current profiles…</p>
    <div class="links" id="links"></div>
    <a class="home" href="../">← Visit the Lawn-A-Mercy website</a>
  </main>
  <script>
    const icons={instagram:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>',tiktok:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4v10.2a4.2 4.2 0 1 1-3.2-4.1M14 4c.7 2.4 2.3 3.8 5 4"/></svg>',linkedin:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 10v7M8 7v.1M12 17v-7m0 3c.6-2 5-2.2 5 1v3"/></svg>',call:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4H4c0 9 7 16 16 16v-3l-4-2-2 2c-3-1-6-4-7-7l2-2-2-4Z"/></svg>'};
    const labels={instagram:'Instagram',tiktok:'TikTok',linkedin:'LinkedIn'};
    function safe(value){try{const u=new URL(value);return ['https:','http:','tel:','sms:','mailto:'].includes(u.protocol)?u.href:''}catch{return''}}
    async function load(url){const mark=url.includes('?')?'&':'?';const response=await fetch(url+mark+'v='+Date.now(),{cache:'no-store'});if(!response.ok)throw new Error(response.status);return response.json()}
    function makeLink(name,url,handle,isCall=false){const a=document.createElement('a');a.className='link'+(isCall?' link-call':'');a.href=url;if(!isCall){a.target='_blank';a.rel='noopener noreferrer'}const icon=document.createElement('span');icon.className='icon';icon.innerHTML=icons[name]||icons.call;const copy=document.createElement('span');copy.className='copy';const strong=document.createElement('strong');strong.textContent=isCall?'Call Steven':labels[name]||name;const small=document.createElement('span');small.textContent=handle||'Follow Lawn-A-Mercy';copy.append(strong,small);const arrow=document.createElement('span');arrow.className='arrow';arrow.setAttribute('aria-hidden','true');arrow.textContent=isCall?'→':'↗';a.append(icon,copy,arrow);return a}
    (async()=>{try{let config=await load('../data/site.json');if(config.runtime?.remote_config_url){try{config=await load(config.runtime.remote_config_url)}catch{}}const query=new URLSearchParams(location.search).get('to')||'socials';if(query!=='socials'){const destination=safe(config.routes?.[query]||config.social?.[query]);if(destination){location.replace(destination);return}}const box=document.getElementById('links');document.getElementById('status').textContent='Choose where you want to connect with Lawn-A-Mercy.';Object.entries(config.social||{}).forEach(([name,value])=>{const url=safe(value);if(url)box.appendChild(makeLink(name,url,config.social_handles?.[name]))});const call=safe(config.routes?.call)||'tel:+16782384010';box.appendChild(makeLink('call',call,config.contact?.phone||'678-238-4010',true))}catch{document.getElementById('status').textContent='Social profiles could not load right now.';const box=document.getElementById('links');const fallback=document.createElement('p');fallback.className='fallback';fallback.innerHTML='Call or text <a href="tel:+16782384010">678-238-4010</a>.';box.appendChild(fallback)}})();
  </script>
</body>
</html>
